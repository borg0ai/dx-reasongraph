name: CI

# Workspace coordinator at the repo root; the CLI package is apps/cli
# (@borg0ai/reasongraph). Install, build, and test that package only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borg0ai/reasongraph typecheck
      - run: pnpm --filter @borg0ai/reasongraph build
      - run: pnpm --filter @borg0ai/reasongraph test
