name: Release

# Create a GitHub Release with the packed CLI tarball when a version tag (v*)
# is pushed. Package channels (luban-homebrew, cangjie-nix, shennong-bucket)
# install from these release assets; nothing is published to npm. Cut the
# release by hand from apps/cli — `npm version <patch|minor|major>` then
# `git push --follow-tags` — so the decision to ship stays a human gate.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@v7
      # No `version:` here — packageManager in the root package.json pins pnpm.
      # Setting both makes action-setup fail with "Multiple versions specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borg0ai/reasongraph typecheck
      - run: pnpm --filter @borg0ai/reasongraph build
      - run: pnpm --filter @borg0ai/reasongraph test
      - name: Pack tarball and checksums
        working-directory: apps/cli
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npm pack
          shasum -a 256 *.tgz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" apps/cli/*.tgz apps/cli/SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
