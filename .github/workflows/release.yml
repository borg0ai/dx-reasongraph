name: Release

# Publish @borg0ai/reasongraph when a version tag (v*) is pushed. Cut the
# release by hand from apps/cli — `npm version <patch|minor|major>` then
# `git push --follow-tags` — so the decision to ship stays a human gate; this
# only automates the rote build-test-publish once you've made that call.
#
# One-time setup: add an `NPM_TOKEN` repo secret (npm → Access Tokens →
# Granular/Automation token with publish rights for `@borg0ai/reasongraph`),
# under Settings → Secrets and variables → Actions.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm attach build provenance to the published package
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @borg0ai/reasongraph typecheck
      - run: pnpm --filter @borg0ai/reasongraph build
      - run: pnpm --filter @borg0ai/reasongraph test
      - run: npm publish --access public --provenance
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
