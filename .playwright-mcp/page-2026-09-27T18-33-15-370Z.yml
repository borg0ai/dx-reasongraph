                - generic [ref=e73]: Stores one shared Markdown decision pack per branch under .reasongraph/why/. The read side does not care which agent wrote the session.
              - button "Transcript adapters" [ref=e74] [cursor=pointer]:
                - strong [ref=e79]: Transcript adapters
                - generic [ref=e80]: Discovers sessions for the current repo and normalizes them into user_text, assistant_text, thinking, and tool_call_summary. Active tools are Claude Code, Codex, OpenCode, and cursor-agent. JSONL adapters keep a byte offset. OpenCode reads session_v2 and session_message and ignores a legacy session table.
              - button "Session state" [ref=e81] [cursor=pointer]:
                - strong [ref=e87]: Session state
                - generic [ref=e88]: Persists one record per session, including last_distilled_offset for JSONL and last_distilled_cursor for OpenCode. The map key is the session id shared databases need.
              - button "Session distill" [ref=e89] [cursor=pointer]:
                - strong [ref=e94]: Session distill
                - generic [ref=e95]: Reads only the undistilled span through readNew and merges normalized events into the branch why-pack. A truncated distill does not advance either cursor.
